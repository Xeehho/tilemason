name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            感谢提交第一个 issue！🎉 请顺手看一眼 [设计基准](https://github.com/Xeehho/tilemason/blob/main/docs/design.md)，功能相关讨论以它为准。
          pr-message: |
            感谢你的第一个 PR！🎉 CI 会自动跑导入/脚本检查/冒烟启动三道关，保持绿灯即可。注意仓库不接受第三方版权素材。
